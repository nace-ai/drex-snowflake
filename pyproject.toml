# For development and the tests only: Snowflake runs src/drex_snowflake.py from a stage (see sql/setup.sql), and
# nothing here is published to PyPI.
[project]
name = "drex-snowflake"
version = "0.2.0"
description = "Drex decisions as Snowflake SQL functions"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
# What the functions' PACKAGES install in Snowflake; keep the two in step
dependencies = [
    "nace-sdk==0.6.2",
    "pandas>=2.0",
]

[dependency-groups]
dev = [
    "jsonschema>=4",
    "pytest>=8",
    "ruff>=0.6",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests/mock"]
addopts = ["--strict-markers", "--tb=short"]

[tool.ruff]
target-version = "py311"
line-length = 120
extend-exclude = ["tests/mock"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "RUF", "SIM", "BLE", "PLC0415"]
